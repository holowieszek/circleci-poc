version: 2.1

env: &env
  environment:
    TOFU_VERSION: 1.8.0

defaults: &defaults
  docker:
    - image: cimg/base:2023.03
  <<: *env

install_tofu: &install_tofu
  name: Install OpenTofu
  command: |
    curl -L "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" -o tofu.zip
    unzip -o tofu.zip
    sudo install -m 0755 tofu /usr/local/bin/tofu
    rm -rf tofu
    rm -rf tofu.zip
    tofu --version

jobs:
  build:
    <<: *defaults
    steps:
      - checkout
      - run: echo "build"

  test:
    <<: *defaults
    steps:
      - checkout
      - run: echo "test"

workflows:
  dev-workflow:
    jobs:
      - build
      - test:
          requires:
            - build
