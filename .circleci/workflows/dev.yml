version: 2.1

orbs:
  gcp-cli: circleci/gcp-cli@3.3.1

env: &env
  environment:
    TOFU_VERSION: 1.8.0

defaults: &defaults
  docker:
    - image: cimg/base:2023.03
  resource_class: small
  <<: *env

install_tofu: &install_tofu
  name: Install OpenTofu
  command: |
    .circleci/scripts/install-tofu.sh
    mkdir -p /tmp
    cp $(which tofu) /tmp

#install_gcp: &install_gcp
#  gcp-cli/setup:
#    version: 404.0.0
#    gcloud_service_key: DEV_GCLOUD_SERVICE_KEY
#    google_project_id: DEV_GCLOUD_PROJECT_ID

configure_gcp: &configure_gcp
  name: Configure GCP
  command: |
    echo "$DEV_GCLOUD_SERVICE_KEY" > service-account-key.json
    echo "export GOOGLE_APPLICATION_CREDENTIALS=service-account-key.json" >> $BASH_ENV
    echo "export GOOGLE_APPLICATION_CREDENTIALS=service-account-key.json" >> /tmp/new-env-vars

persist: &persist
  persist_to_workspace:
    root: .
    paths:
      - .

attach: &attach
  attach_workspace:
    at: .

restore_cache: &restore_cache
  name: Restore cache
  command: |
    sudo cp /tmp/tofu /usr/local/bin/tofu
    chmod +x /usr/local/bin/tofu

    cat /tmp/service-account-key.json >> $BASH_ENV

jobs:
  #setup:
  #  <<: *defaults
  #  steps:
  #    - checkout
  #    - *install_gcp
  #    - run: *install_tofu
  #    - *persist
  setup:
    <<: *defaults
    steps:
      - checkout
      - run: *install_tofu
      - run: *configure_gcp
      - *persist

  init:
    <<: *defaults
    steps:
      - *attach
      - run:
          command: ls
      - run: *restore_cache
      - run: |
          tofu init \
            --backend-config=config/backend/dev.tfbackend \
            --backend-config="bucket=$DEV_GCP_TERRAFORM_STATE_BUCKET"
      - *persist

  plan:
    <<: *defaults
    steps:
      - *attach
      #- *install_gcp
      - run: *install_tofu
      - run: *configure_gcp
      - run: |
          tofu plan \
            -var-file=config/environment/dev.tfvars \
            -var="project_id=$DEV_GCLOUD_PROJECT_ID" \
            -var="region=$DEV_GCLOUD_REGION" \
            -var="zone=$DEV_GCLOUD_ZONE" \
            -out=tofuplan
      - *persist

  apply:
    <<: *defaults
    steps:
      - *attach
      #- *install_gcp
      - run: *install_tofu
      - run: *configure_gcp
      - run: tofu apply tofuplan

workflows:
  dev-workflow:
    jobs:
      - setup
      - init:
          requires:
            - setup
      - plan:
          requires:
            - init
      - apply:
          requires:
            - plan
