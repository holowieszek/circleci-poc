version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@0.1.2

workflows:
  setup:
    jobs:
      - determine-workflow

jobs:
  determine-workflow:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout
      - run:
          name: Determine workflow based on branch
          command: ./circleci/scripts/select-workflow.sh
