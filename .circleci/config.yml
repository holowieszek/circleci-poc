version: 2.1

setup: true

orbs:
  continuation: circleci/continuation@2.0.0

workflows:
  setup:
    jobs:
      - determine-workflow

jobs:
  determine-workflow:
    docker:
      - image: cimg/base:stable

    environment:
      CIRCLE_PULL_REQUEST_BASE_BRANCH: << pipeline.event.github.pull_request.base.ref >> || "null"
      CIRCLE_PULL_REQUEST_HEAD_BRANCH: << pipeline.event.github.pull_request.head.ref >> || "null"
    steps:
      - checkout
      - run:
          name: Determine workflow based on branch
          command: .circleci/scripts/select-workflow.sh
      - run:
          name: printenv
          command: printenv
      - continuation/continue:
          configuration_path: .circleci/workflows/selected_workflow.yml
